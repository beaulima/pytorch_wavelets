[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch_wavelets"
description = "A port of the DTCWT toolbox to run on pytorch"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Fergal Cotter", email = "fbc23@cam.ac.uk" },
]
keywords = ["pytorch", "DWT", "DTCWT", "wavelet", "complex wavelet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: Free To Use But Restricted",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# PyWavelets is imported at module scope by pytorch_wavelets.dwt, which the
# top level __init__ pulls in - it is a hard runtime dependency, not just a
# test one.
dependencies = [
    "numpy",
    "torch>=1.0.0",
    "PyWavelets>=1.0.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/fbcotter/pytorch_wavelets"
Documentation = "https://pytorch-wavelets.readthedocs.io/"

[project.optional-dependencies]
test = [
    "pytest>=4.6",
    "pytest-cov",
    "coverage",
    # The numpy reference implementation the DTCWT tests compare against. It
    # declares numpy<2.0.0, which constrains the whole test environment - the
    # library itself has no such limit.
    "dtcwt",
    "py3nvml",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinxcontrib-bibtex",
    "docutils",
    "matplotlib",
    "ipython",
]
dev = [
    "pytorch_wavelets[test,docs]",
    "pandas",
    "flake8",
    "build",
]

[tool.setuptools.dynamic]
version = { attr = "pytorch_wavelets._version.__version__" }

[tool.setuptools.packages.find]
include = ["pytorch_wavelets*"]

[tool.setuptools.package-data]
"pytorch_wavelets.dtcwt.data" = ["*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The slow marker covers the gradchecks over full-size inputs. They are real
# tests, not dead ones - CI runs them in their own job (make test-slow).
addopts = "-ra -m 'not slow'"
markers = [
    "slow: gradchecks that take minutes; excluded from the default run",
]

[tool.coverage.run]
source = ["pytorch_wavelets"]
