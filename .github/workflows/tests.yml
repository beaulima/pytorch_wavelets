name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 04:00 UTC, so the slow gradchecks run at least weekly even if
    # nothing lands on master.
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The default PyPI torch wheel bundles CUDA and is ~2.5GB. The runners
      # have no GPU, so pull the CPU build instead - it is an order of
      # magnitude smaller and satisfies the torch requirement, so the install
      # below will not replace it.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test dependencies
        run: pip install ".[test]"

      - name: Show the resolved environment
        run: pip list

      - name: Run tests
        run: pytest --cov=pytorch_wavelets --cov-report=term

  slow:
    name: slow gradchecks
    runs-on: ubuntu-latest
    # 24 minutes on a laptop GPU, dominated by eight ScatLayerj2 gradchecks at
    # ~2 minutes each. A CPU runner is slower, hence the generous cap.
    timeout-minutes: 120
    # Kept off the pull request path so PRs stay fast; these run on master,
    # on the weekly schedule, and on demand.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test dependencies
        run: pip install ".[test]"

      # These compare full-size analytical gradients against finite
      # differences. They are excluded from the default run by an addopts
      # marker filter, not skipped.
      - name: Run the slow gradchecks
        run: pytest -m slow

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install flake8

      # A full run against .flake8, which ignores two cosmetic classes the
      # codebase uses consistently (E226/E231 tight spacing) and nothing else.
      - name: Lint
        run: flake8 --show-source pytorch_wavelets tests examples

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and doc dependencies
        run: pip install ".[docs]"

      # -W turns warnings into errors: the build is clean today and should
      # stay that way.
      - name: Build the docs
        run: sphinx-build -b html -W docs docs/_build/html

      # notebooks/ is generated from examples/, so it can go stale silently.
      - name: Check notebooks/ is in step with examples/
        run: python tools/make_notebooks.py --check
