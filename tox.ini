[tox]
envlist = py310, py311, py312, py313, py314
isolated_build = True

[testenv]
# The test extra brings the dtcwt reference package, which pins numpy<2 and
# so cannot install past Python 3.12. From 3.13 the suite runs without it -
# tests/conftest.py leaves out the files that need it.
extras =
    py310,py311,py312: test
deps =
    py313,py314: pytest
    py313,py314: pytest-cov
commands = pytest --cov --cov-report=term {posargs}

[testenv:docs]
extras = docs
changedir = docs
commands = sphinx-build -b html . _build/html
